spring.application.name=reservation-app
server.port=${PORT:8080}

# --- DB（未指定ならローカルのH2ファイルDB。デプロイ時は環境変数でPostgreSQL等に切替） ---
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/reservation;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JSON（APIの項目名はAPI仕様書に合わせてsnake_case、日時はJST） ---
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.time-zone=Asia/Tokyo

# --- セッションCookie（別オリジンで公開する場合は SameSite=none, Secure=true を指定） ---
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true

# --- アプリ設定 ---
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
app.seed.enabled=${SEED_ENABLED:true}
